[project]
name = "datalab-agent"
version = "0.1.0"
description = "A chat-based ML co-pilot: upload a dataset, talk to the agent, it profiles, plans, trains and compares models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "chainlit>=2.12.0",
    "openai>=1.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    # chainlit 2.12 imports literalai -> traceloop -> requests at import time but
    # does not declare it. Without this, `import chainlit` fails. See NOTES.md.
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datalab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: end-to-end rehearsal with real model fits (skip with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
